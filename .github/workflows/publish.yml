name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish
    environment:
      name: publish
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the version
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/setup-go@v7
        with:
          go-version-file: js/go.mod
      - name: Install tinygo
        env:
          TINYGO_VERSION: 0.44.0
          TINYGO_SHA256: ed0f45543a49ff2a99120a5a1b8814a0750e1fda1a66f8e2a0a172576134aaf9
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/tinygo.tar.gz" "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          echo "$TINYGO_SHA256  ${RUNNER_TEMP}/tinygo.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/tinygo.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/tinygo/bin" >> "$GITHUB_PATH"
      - name: Install wasm-opt
        env:
          BINARYEN_VERSION: 133
          BINARYEN_SHA256: 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/binaryen.tar.gz" "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          echo "${BINARYEN_SHA256}  ${RUNNER_TEMP}/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/binaryen.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/binaryen-version_${BINARYEN_VERSION}/bin" >> "${GITHUB_PATH}"
      - run: test "v$(node -p 'require("./js/package.json").version')" = "$GITHUB_REF_NAME"
      - run: env -C js npm ci --ignore-scripts
      - run: env -C js go run ./src -toolchain=tinygo
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: js/dist/kepubify.wasm
      - run: env -C js npm publish
